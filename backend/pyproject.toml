[project]
name = "dayzero-backend"
version = "0.1.0"
description = "Day Zero: 3-party persona conversation + personality observation (PR1)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "fastmcp>=2.10",
  "google-genai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
