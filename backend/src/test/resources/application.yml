spring:
  datasource:
    url: jdbc:h2:mem:dayzero;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa.hibernate.ddl-auto: none
dayzero:
  internal-port: 8081
  internal-key: test-internal-key
  jwt-secret: test-jwt-secret-test-jwt-secret-test-jwt-secret
  jwt-ttl-minutes: 60
  agent-url: http://localhost:1
  dispatch: none
  invite-ttl-hours: 72
  seed-demo: true
  task-stale-minutes: 10
  # inert in tests (first sweep after a day); tests call TaskWatchdog.sweep() directly
  task-watchdog-interval-ms: 86400000
  # no agent in tests: ask for its task types once
  agent-check-attempts: 1
