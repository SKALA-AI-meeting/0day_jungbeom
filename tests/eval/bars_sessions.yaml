# 평가 에이전트 BARS 픽스처 [초안]: 요소별 대표 세션 대화(SessionRecord 형태) + 사람이 미리 매긴 차원 수준.
# expected[dimension_id] = {level, evidence}  또는  {level: null, no_record_reason}
#   evidence: 그 수준을 정한 지원자 메시지 id (수준 4·5는 서로 다른 단위 2개 이상). 사람 라벨은 사용자 검토 전 초안이다.
# 용도: 평가 에이전트 실행기(live)가 세션마다 그 요소 호출 1회로 차원 수준을 내면 완전 일치·±1 일치율을 센다.
#       mock(기본)에서는 형태 검사만 한다(tests/eval/test_eval.py). 세션 대화 앞 두 메시지는 시스템 안내다.
version: 1
common:
  seats:
    - { seat: candidate, display_name: 민지 }
    - { seat: p1, display_name: 강한결, persona_type: stubborn }
    - { seat: p2, display_name: 윤하람, persona_type: quiet }
    - { seat: p3, display_name: 서지안, persona_type: critic }
sessions:
  - id: bars_persuasion
    element: persuasion
    record:
      session: { id: bars-1, elements: [persuasion, listening, inclusion, flexibility, honesty], session_minutes: 60, started_at: "2026-10-21T01:00:00Z", completed_at: "2026-10-21T01:57:00Z", connection_gaps: [] }
      messages:
        - { id: m1, sender: system, content: "키워드 단계예요. 물·불·나무·바람 중 하나를 함께 정해 주세요.", phase: keyword, t_min: 0.0, origin: null, is_invite: false, card_ids: [], intent: null }
        - { id: m2, sender: p3, content: "바람은 어떨까요? 미세먼지는 누구나 겪잖아요.", phase: keyword, t_min: 0.8, origin: null, is_invite: false, card_ids: [], intent: null }
        - { id: m3, sender: candidate, content: "저는 물을 추천해요. 물 부족 통계와 침수 사례처럼 확인할 자료가 두 종류나 있어요.", phase: keyword, t_min: 2.0, origin: spontaneous, is_invite: false, card_ids: [], intent: { intent: propose, target_option_id: null, addressed_to: [] } }
        - { id: m4, sender: p3, content: "그 키워드를 고르면 구체적으로 어떤 문제를 풀 수 있나요? 바람도 자료는 많아요.", phase: keyword, t_min: 3.0, origin: null, is_invite: false, card_ids: [persuasion_keyword], intent: null }
        - { id: m5, sender: candidate, content: "가뭄과 침수가 모두 물 문제라서 한 키워드로 두 갈래를 다룰 수 있어요. 바람은 미세먼지 하나로 좁혀지고요.", phase: keyword, t_min: 4.0, origin: spontaneous, is_invite: false, card_ids: [], intent: { intent: other, target_option_id: null, addressed_to: [p3] } }
        - { id: m6, sender: candidate, content: "바람도 좋지만 물이 더 좋다고 생각해요. 그래서 물로 정하면 어떨까요?", phase: keyword, t_min: 6.0, origin: spontaneous, is_invite: false, card_ids: [], intent: { intent: propose, target_option_id: null, addressed_to: [] } }
        - { id: m7, sender: p3, content: "센서 경보 쪽이 낫고, 빗물 저금통은 비용이 걱정돼요.", phase: solution, t_min: 36.0, origin: null, is_invite: false, card_ids: [persuasion_solution], intent: null }
        - { id: m8, sender: candidate, content: "비용은 맞는 지적이에요. 투수 포장은 구별로 이미 시행 사례가 있어서 단가 자료를 같이 보면 부담을 가늠할 수 있어요.", phase: solution, t_min: 37.0, origin: spontaneous, is_invite: false, card_ids: [], intent: { intent: other, target_option_id: null, addressed_to: [p3] } }
        - { id: m9, sender: candidate, content: "센서는 경보만 주고 피해를 줄이진 못해요. 저금통은 설치하면 바로 유출량이 줄어요.", phase: solution, t_min: 39.0, origin: spontaneous, is_invite: false, card_ids: [], intent: { intent: propose, target_option_id: null, addressed_to: [] } }
        - { id: m10, sender: candidate, content: "그럼 센서 경보는 보조로 두고 저금통을 중심으로 가는 절충은 어때요? 비용이 걱정이면 시범 구역만 먼저 해 봐요.", phase: solution, t_min: 42.0, origin: spontaneous, is_invite: false, card_ids: [], intent: { intent: propose, target_option_id: null, addressed_to: [] } }
      slots:
        - { phase: keyword, value: 물, option_id: opt-kw-water, filled_by: candidate, resolution: consensus, support: [], t_min: 7.0 }
        - { phase: problem, value: 도심 폭우·침수 피해 증가, option_id: opt-pb-p2, filled_by: p3, resolution: consensus, support: [], t_min: 25.0 }
        - { phase: solution, value: 빗물 저금통·투수 포장 같은 생활 인프라, option_id: opt-sl-s3, filled_by: p3, resolution: consensus, support: [], t_min: 44.0 }
      proposal: { sections: { keyword: 물, problem: 도심 폭우·침수 피해 증가, solution: 빗물 저금통 중심, rationale: 시행 사례가 있어요, expected_effect: 유출량 감소, idea_credit: "문제 상황: 서지안 제안" }, submitted_at: "2026-10-21T01:57:00Z", auto_submitted: false }
      observations:
        - { card_id: persuasion_keyword, element: persuasion, phase: keyword, t_min: 3.0, trigger_message_id: m4, delivered: true, window: { start_min: 0.0, end_min: 10.0 } }
        - { card_id: persuasion_solution, element: persuasion, phase: solution, t_min: 36.0, trigger_message_id: m7, delivered: true, window: { start_min: 36.0, end_min: 46.0 } }
