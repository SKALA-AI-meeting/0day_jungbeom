# Day Zero 로컬 구성. 공개 포트는 web(3000), api(8000), rabbitmq 관리 UI(127.0.0.1 전용)뿐이다. 나머지는 compose 네트워크 안.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dayzero
      POSTGRES_PASSWORD: dayzero
      POSTGRES_DB: dayzero
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayzero"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:15672:15672"   # 관리 UI, 로컬에서만
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../services/api
    env_file: .env
    ports:
      - "8000:8000"        # 공개 API. 내부 API 8001은 공개하지 않는다
    expose: ["8001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      business-mcp: { condition: service_healthy }
      rag-mcp: { condition: service_healthy }
    volumes:
      - ../scenarios:/scenarios:ro

  business-mcp:
    build: ../services/business-mcp
    env_file: .env
    expose: ["9101"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9101/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  rag-mcp:
    build: ../services/rag-mcp
    env_file: .env
    expose: ["9102"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9102/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60   # 모델 로드 시간
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../scenarios:/scenarios:ro
      - hfcache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 3g

  report-worker:
    build: ../services/report-worker
    env_file: .env
    healthcheck:   # 워커가 30초마다 갱신하는 heartbeat 파일
      test: ["CMD-SHELL", "test -f /tmp/heartbeat && test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 90"]
      interval: 15s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      api: { condition: service_healthy }

  web:
    build: ../apps/web
    env_file: .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  rabbitdata:
  hfcache:
