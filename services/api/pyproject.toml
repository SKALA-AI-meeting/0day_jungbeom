[project]
name = "dayzero-api"
version = "0.1.0"
description = "Day Zero api: 인증, 화면 API, WebSocket, 스케줄러, 에이전트 모듈"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "python-dotenv>=1.0",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "aio-pika>=9.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-openai>=0.2",
  "mcp>=1.9",
  "tiktoken>=0.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 실제 LLM 호출"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
