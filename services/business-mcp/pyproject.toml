[project]
name = "dayzero-business-mcp"
version = "0.1.0"
description = "Day Zero business-mcp: 세션·메시지·보드·문서·관찰 도구(api 내부 엔드포인트 호출)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastmcp>=2.10",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 실제 LLM 호출"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
