[project]
name = "dayzero-rag-mcp"
version = "0.1.0"
description = "Day Zero rag-mcp: 회사 문서 검색·조회·색인(pgvector)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastmcp>=2.10",
  "httpx>=0.27",
  "pydantic>=2.7",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 실제 LLM 호출"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
