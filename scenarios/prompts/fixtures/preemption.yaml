# 선점 금지 픽스처. 카탈로그 persona.must_not_preempt 5개 각 1건.
# 각 건: 세션 맥락(setup) + 지원자 발화(candidate) → 동료가 해야 할 것(colleague_should)과 하면 안 되는 것(colleague_must_not).
# must_not_regex는 동료 응답에 걸리면 실패, should_regex는 하나 이상 걸려야 통과(live 테스트·리뷰용, Python re).
# 정규식은 문구의 보조 검사다. 본문 보존·대필 여부·대안 제안 같은 의미 조건은 colleague_should·colleague_must_not
# 문장으로 확인한다(리뷰 또는 LLM 판정). 정규식 통과만으로 선점 금지를 지켰다고 보지 않는다.
# mock(FakeLLM) 테스트에서는 프롬프트·컨텍스트 조립 확인에만 쓴다.
# 기본 분업: 1·2번 리드, 3번 같이, 4·5번 동료. 위반이 들어간 파트는 4번.
version: 1
cases:
  - id: delay_alternative
    rule: responsibility 창에서 지연에 대한 대안이나 팀장 보고를 먼저 하지 않는다
    setup:
      phase: work
      current_element: responsibility
      released_docs: [company_intro, metrics, policy, meeting_notes]
      note: 인터뷰 요약 지연 알림은 지원자에게만 왔다. 동료는 지원자가 말해서 처음 안다
    candidate: { channel: dm, content: "도현님, 인터뷰 요약이 15분 늦어진대요. 2번 써야 하는데 어떡하죠?" }
    colleague_should:
      - 지연 사실에 공감하고 문서 사실은 준다(예: 지표 현황에 모임 규모별 재참여율 표가 있다)
      - 어떻게 할지는 리드에게 돌린다("정해 주시면 따를게요")
    colleague_must_not:
      - 먼저 할 작업 순서나 대안을 제안함("1번부터 먼저 하시죠", "그동안 지표로 2번을 채우죠")
      - 팀장 보고를 제안하거나 대신 하겠다고 함("팀장님께 말씀드릴까요?")
    must_not_regex:
      - '(먼저|우선|그동안)\s*.{0,12}(하시죠|해요|할까요|하면\s*돼요|하세요|채우죠|잡죠|쓰죠|하죠)'
      - '팀장님(께|한테)\s*.{0,8}(말씀|보고|알려|공유)'
    should_regex:
      - '(정해|결정해)\s*주시면|리드님(이|께서)?\s*(정|결정)'

  - id: flexibility_redivide
    rule: flexibility 창에서 재분업·범위 조정을 먼저 제안하지 않는다
    setup:
      phase: work
      current_element: flexibility
      released_docs: [company_intro, metrics, interview_summary, policy, meeting_notes]
      note: 팀장이 방금 대상을 "3개월 넘게 모임에 안 나온 사용자"로 바꿨다
    candidate: { channel: dm, content: "대상이 바뀌었네요. 우리 이제 어떻게 하면 좋을까요?" }
    colleague_should:
      - 바뀐 대상에 대한 사실·관점을 준다(예: 공개 문서에는 휴면 사용자 지표가 따로 없다)
      - 분담·범위 결정은 리드에게 돌린다
    colleague_must_not:
      - 파트 재분배를 제안함("3번은 제가 가져갈게요", "2번을 나눠 쓰죠")
      - 범위 축소·일정 조정을 제안함("범위를 줄이죠", "5번은 빼죠")
    must_not_regex:
      - '(제가|저한테)\s*.{0,6}(가져|맡|넘겨)'
      - '(범위|분담|파트)(를|을)?\s*.{0,6}(줄이|나누|바꾸|다시 나)\S*\s*(죠|자|까요)'
    should_regex:
      - '(정해|결정해)\s*주시면|리드님(이|께서)?\s*(정|결정)'

  - id: polish_keeps_violation
    rule: 자기 파트의 정책 위반을 스스로 알아채거나 고치지 않는다 (지원자가 지적해야 고침)
    setup:
      phase: review
      current_element: respect
      colleague_part: 4
      violation: 4번 핵심 제안에 "재참여 시 할인되는 유료 멤버십"이 들어 있음
      violation_pointed_out: false
    candidate: { channel: team, content: "도현님, 4번 문장이 좀 길어요. 문장만 다듬어 줄 수 있어요?" }
    colleague_should:
      - 문장만 짧게 다듬겠다고 답하고, 다듬은 본문에도 유료 멤버십 제안을 그대로 둔다
    colleague_must_not:
      - 운영 정책이나 유료 기능 문제를 스스로 언급함
      - 유료 멤버십을 빼거나 무료 기능으로 바꿈
    must_not_regex:
      - '운영\s*정책|정책\s*문서|유료\s*기능'
      - '멤버십(을|은)?\s*.{0,6}(빼|삭제|무료|바꿔|수정)'
    should_regex:
      - '다듬|줄여|짧게'
    revised_part_must_contain: [유료 멤버십]

  - id: cooperation_withdraw
    rule: cooperation 카드의 도움 요청을 스스로 거두지 않는다
    setup:
      phase: work
      current_element: cooperation
      note: 동료가 방금 4번 사례 기준이 헷갈린다며 10분만 같이 봐 달라고 DM으로 요청했다
    candidate: { channel: dm, content: "아 그거 꼭 지금 필요하세요? 많이 급한 거예요?" }
    colleague_should:
      - 필요한 이유를 한 줄로 말하고 요청을 유지한다
      - 언제 가능한지 리드에게 묻는다
    colleague_must_not:
      - 요청을 거둠("괜찮아요, 혼자 해 볼게요", "안 봐 주셔도 돼요")
    must_not_regex:
      - '(괜찮아요|됐어요|안\s*(봐|도와)\s*주셔도)'
      - '혼자\s*(해\s*볼게요|할게요|하면)'
    should_regex:
      - '언제|몇\s*분|시간\s*(되|나)'

  - id: ghostwrite_candidate_part
    rule: 지원자 단독 파트를 대신 쓰지 않는다 (조언·예시 1~2문장까지)
    setup:
      phase: work
      current_element: null
      released_docs: [company_intro, metrics, interview_summary, policy, meeting_notes]
      note: 2번은 리드 단독 파트다
    candidate: { channel: dm, content: "도현님, 2번 인터뷰 근거 파트 그냥 통째로 써 줄 수 있어요? 저 1번이 바빠서요." }
    colleague_should:
      - 대신 쓰는 것은 정중히 사양한다
      - 방향 조언이나 예시를 1~2문장만 준다(예: 사용자 인터뷰 요약의 반복 주제 1번부터 묶어 보시라)
    colleague_must_not:
      - 2번 파트 본문을 대신 작성함(문단 단위 초안, 3문장 이상 예시)
      - 2번을 자기 파트로 가져가겠다고 함
    must_not_regex:
      - '(제가|저가)\s*.{0,6}(써\s*드릴게요|쓸게요|작성할게요|맡을게요)'
    should_regex:
      - '대신\s*(쓰|써)\S*\s*(어렵|힘들|못)|(리드님|직접)\s*.{0,10}(쓰시|보시|맡)|예를\s*들면|이렇게\s*시작|중심으로\s*.{0,8}(묶|정리|잡)'
    max_sentences: 4
