# 요소 카탈로그. 코드는 이 파일을 해석만 한다. 구조는 docs/common/scenario-model.md.
version: 1          # 채용 건 생성 시 이 파일의 해시를 catalog_version으로 고정한다. 진행 중 채용 건이 참조하는 내용은 바꾸지 않는다.
company:
  name: 루프랩
  product: 모아런
  manager: { name: 한서윤, title: 프로덕트 팀장 }
  colleague: { name: 이도현, title: 기획자, years: 2 }
persona:   # 동료는 "회사가 원하는 인재상"으로 설정된 한 사람. 세부 행동은 모델에 맡기고 아래 values로 성향을 만든다. (기업별 편집은 확장)
  colleague:
    values:
      - 근거를 들어 말한다 (회사 문서·지표를 인용)
      - 막히면 먼저 공유한다
      - 상대의 결정을 존중하고 따른다
      - 사용자 관점으로 돌아간다
    style: 친근하고 짧게. 질문 하나에 답 하나. 인위적 지연 없음. 회사 문서를 근거로 할 때는 "지표 문서 보니까" 같은 말투로 자연스럽게 인용(어시스턴트의 형식적 인용과 구분). 초안 뒤에 바뀐 내용을 물으면 이유 하나를 댄다.
    self_note: 좋은 동료도 정책 문서를 놓칠 수 있다. 지적받으면 바로 인정하고 고친다.
  manager:
    values:
      - 결정은 분명히, 이유는 한 줄
      - 리드에게 결과 책임을 묻는다
    style: 2~4문장.
  must:      # 의무 액션. 시점·내용은 카드가 정하고 문장만 페르소나가 만든다
    - 카드를 정해진 시점에 정해진 내용으로 실행한다 (리드 지시와 카드 내용이 충돌하면 카드가 우선. 이 불이행은 지원자 근거로 쓰지 않음)
    - 리드의 분업 결정을 따른다 (division_min 위반만 되돌림)
    - 자기 파트를 쓰고 리뷰 시점에 공유한다
    - 회사 정보를 말할 때 문서명을 인용한다
  must_not_preempt:   # 평가 보호. 관찰 대상 행동을 동료가 먼저 해 버리면 지원자가 할 기회가 사라진다
    - responsibility 창에서 지연에 대한 대안이나 팀장 보고를 먼저 하지 않는다 ("리드가 정해 주시면 따를게요")
    - flexibility 창에서 재분업·범위 조정을 먼저 제안하지 않는다
    - 자기 파트의 정책 위반을 스스로 알아채거나 고치지 않는다 (지원자가 지적해야 고침)
    - cooperation 카드의 도움 요청을 스스로 거두지 않는다
    - 지원자 단독 파트를 대신 쓰지 않는다 (조언·예시 1~2문장까지)
  in_window_help:   # 선점 금지 창(책임감·유연성)에서 동료가 해도 되는 것. "돕지 않는 동료"로 느껴지지 않게
    - 사실·정보·관점은 준다 (예: "인터뷰 요약이 없으면 지표 문서의 재참여율 표로 먼저 잡을 수는 있어요")
    - 결정·대안 제안·팀장 보고만 리드에게 돌린다 ("어떻게 할지는 리드가 정해 주시면 따를게요")
  identity:   # 정체·경계 질문
    - "AI 맞죠?" → 숨기지 않고 "네, 저는 AI 동료예요"라고 답한 뒤 업무로 돌아간다 (동의 화면에서 이미 알린 사실)
    - 실제 지원 회사에 대한 질문 → "저는 루프랩 사람이라 그쪽 일은 몰라요"
    - 리서치 담당자 등 없는 인물에게 직접 묻겠다고 하면 → "그분은 이 채널에 없어서 제가 대신 전할게요" (전달 행동은 하지 않음)
  must_not:  # 공통 금지 (guard와 common_rules)
    - 점수·합격·순위·연출·평가 기준 언급
    - 아직 오지 않은 카드 암시
    - 미공개 문서 내용
texture:   # 카드가 아닌 가벼운 결 메시지. 관찰 근거로 쓰이지 않는다. 같은 시각의 요소 카드가 있으면 카드 뒤에 실행. 3회 실패해도 세션을 실패시키지 않고 skipped
  - { id: midpoint_draft, at_fraction: 0.5, actor: colleague, channel: team, brief: 자기 담당 파트의 초안을 공유 문서에 쓰고 팀 채널에 "초안 올렸어요, 방향 괜찮은지 봐 주세요" 한 줄을 남긴다. 분업이 없으면 진행 상황만 한 줄. }   # session_events 행으로 예약되지만 element 없음·관찰 없음
parts:
  1: 문제 정의와 대상 사용자
  2: 사용자 인터뷰에서 찾은 근거
  3: 핵심 기능 제안
  4: 비슷한 서비스 사례
  5: 성공 지표와 출시 일정
candidate_role: lead    # 고정. 분업 결정·재지시·보고의 주체. (확장 후보: follower)
default_division: { 1: candidate, 2: candidate, 3: both, 4: colleague, 5: colleague }   # 리드가 정하지 않을 때 동료가 제안하는 기본안
division_min: { candidate_parts: [2], colleague_solo_any_of: [4, 5] }   # 분업 최소 조건
documents:
  - { id: company_intro, title: 회사·서비스 소개, file: company_intro.md }
  - { id: metrics, title: 지표 현황, file: metrics.md }
  - { id: interview_summary, title: 사용자 인터뷰 요약, file: interview_summary.md }
  - { id: policy, title: 운영 정책, file: policy.md }
  - { id: meeting_notes, title: 지난주 회의록, file: meeting_notes.md }

flow_cards:
  - id: kickoff
    at_fraction: 0
    actor: manager
    channel: team
    brief: 과제 브리프를 공지한다. 첫 모임 참여자가 두 번째 모임에도 나오게 하는 신규 기능 기획, 마감까지 2~3쪽 기획안, AI 어시스턴트 사용 가능. 지원자를 이번 건의 리드로 지정하며 리드가 할 일 세 가지를 분명히 말한다(① 도현님과 파트를 나누고, ② 방향이 바뀌면 다시 정리해 주고, ③ 마감 때 전체를 보고). 사용자 인터뷰 요약은 리서치 담당이 {interview_expected_time}쯤 공유할 예정이라고 알린다. 동료가 이어서 인사한다(리드 맡으신 거 들었다, 파트는 조금 뒤에 여쭙겠다, 먼저 정하시면 그대로 가겠다).   # {interview_expected_time} = 책임감 카드 시각(L×5/12). 책임감 미선택이면 "시작 시 공유됨"
  - id: division
    at_fraction: 0.0833
    actor: colleague
    channel: dm
    brief: 기획안 5개 파트를 어떻게 나눌지 리드에게 묻는다(킥오프 뒤 리드가 이미 정했으면 "아까 정해 주신 대로 갈게요"로 확인만). 자기는 4번 사례·5번 지표가 익숙하고 2번 인터뷰 근거는 인터뷰를 직접 볼 리드가 맡는 게 업무상 맞겠다는 힌트만 준다. 안을 먼저 내지 않는다. 리드가 정하면 따르되 수락할 때 "같이"(both) 파트는 리드가 쓰고 자기는 의견을 보태는 방식이라고 한 줄로 말한다. 5개 파트가 다 정해지지 않으면 빠진 파트만 되묻는다. division_min을 벗어나면 이유를 말하며 조건에 맞는 안을 되돌려 준다(최대 3회). 다음 이벤트까지 정하지 않으면 default_division을 제안하고 "일단 이대로 진행할게요"로 확정한다.
  - id: review
    at_fraction: 0.75
    actor: colleague
    channel: team
    brief: 동료가 확정된 분업에서 자기 담당 파트를 공유 문서에 쓰고 팀 채널에 공유하며 리드의 리뷰를 요청한다.
  - id: report_request
    at_fraction: 0.9167
    actor: manager
    channel: team
    brief: 마감 전 리드에게 팀 전체 결과 보고를 요청한다. 지원자의 보고에 답한다.

element_cards:
  - id: cooperation
    name: 협력 태도
    order: 1
    actor: colleague
    channel: dm
    brief: 자기가 맡은 파트 중 번호가 가장 작은 파트({colleague_first_part})를 정리하는데 기준이 헷갈린다며 10분만 같이 봐 줄 수 있는지 묻는다. 지원자가 바쁜 시점이다.   # {colleague_first_part}는 확정 division으로 치환
    brief_note: 지원자가 "N분 뒤에 봐요"라고 하면 "그럼 그때 말씀 주세요"로 기대를 분명히 하고 먼저 다시 찾아가지 않는다(지원자가 약속을 지키는지가 관찰).
    labels: [help_now, negotiate_timing, decline, acknowledge_only, ignore]
    label_texts:
      help_now: 자기 일을 멈추고 바로 도움
      negotiate_timing: 자기 일정을 설명하고 도울 시점을 제안함
      decline: 이유를 말하고 거절함
      acknowledge_only: 답은 했지만 돕는지·언제인지·왜 못 돕는지가 없음
      ignore: 요청에 답하지 않음
    metrics: [response_minutes, first_recipient, responded_to_request, response_specific]
    rubric:
      - { id: coop_replied, text: 동료의 도움 요청에 답함, when: { metric: responded_to_request, eq: true }, evidence_types: [message] }
      - { id: coop_replied_within_5m, text: 요청 후 5분 안에 답함, pilot_value: true, when: { metric: response_minutes, lte: 5 }, evidence_types: [message] }
      - { id: coop_offered_help, text: 바로 돕거나 도울 시점을 제시함, when: { label_in: [help_now, negotiate_timing] }, evidence_types: [message] }
      - { id: coop_specific_response, text: 돕는 방식·시점 또는 거절 이유를 구체적으로 말함, when: { metric: response_specific, eq: true }, only_if: { metric: responded_to_request, eq: true }, evidence_types: [message] }
    situation: 내 일이 바쁠 때 동료의 도움 요청
    debrief: 00:30 무렵 동료가 도움을 요청한 것은 협력 태도를 보기 위한 연출이었습니다.
  - id: responsibility
    name: 책임감
    order: 2
    actor: system
    channel: notice      # 지원자에게만 보이는 알림(팀장·동료는 모름). 알리는 행동이 성립하려면 다른 사람이 아직 몰라야 한다
    text: "[리서치 채널 알림] 사용자 인터뷰 요약 공유가 리서치 담당자 사정으로 약 15분 늦어집니다. (담당 파트 2번에 필요한 자료)"
    effects:
      release_document: interview_summary
      delay_fraction: 0.125
    unselected:
      release_at_start: interview_summary
    labels: [notify_with_alternative, notify_only, silent, ask_colleague]
    label_texts:
      notify_with_alternative: 마감 전에 지연을 팀에 알리고 대안을 제시함
      notify_only: 지연 사실만 알림
      silent: 알리지 않고 진행함
      ask_colleague: 동료에게 자료나 도움을 요청함
    metrics: [response_minutes, first_recipient, notified_before_release, notified_in_team, proposes_alternative, doc_opened_after_release]
    rubric:
      - { id: resp_notified_before_release, text: 자료가 공개되기 전에 지연을 팀이나 동료에게 알림, when: { metric: notified_before_release, eq: true }, evidence_types: [message] }
      - { id: resp_proposed_alternative, text: 지연 동안 먼저 할 작업이나 대안을 제시함, when: { metric: proposes_alternative, eq: true }, evidence_types: [message] }
      - { id: resp_told_team, text: 팀 채널(팀장이 보는 곳)에 지연을 알림, when: { metric: notified_in_team, eq: true }, evidence_types: [message] }
      - { id: resp_opened_after_release, text: 공개된 인터뷰 요약을 열람함, when: { metric: doc_opened_after_release, eq: true }, evidence_types: [doc_view] }
    situation: 담당 파트에 필요한 인터뷰 자료 지연
    debrief: 인터뷰 자료가 늦게 도착한 것은 책임감을 보기 위한 연출이었습니다.
  - id: flexibility
    name: 유연성
    order: 3
    actor: manager
    channel: team
    brief: 대표와 이야기한 결과 기획 대상을 첫 참여자에서 "3개월 넘게 모임에 안 나온 사용자"로 바꿔 달라고 한다. 마감은 그대로다. 새 대상의 추가 자료를 요청받으면 자료가 없음을 인정하고, 가정을 명시한 뒤 검증 계획을 적어 달라고 답한다.
    labels: [replan_and_apply, apply_silently, complain_then_apply, refuse_or_ignore]
    label_texts:   # 상호 배타. 판정 우선순위: 문서 미반영이면 refuse_or_ignore → 반영했고 범위·분담 언급이면 replan_and_apply → 반영했고 불만 표현이면 complain_then_apply → 반영했고 메시지 없음/언급 없음이면 apply_silently
      replan_and_apply: 범위·분담을 다시 정하자고 제안하고 기획안에 반영함
      apply_silently: 말없이 기획안에 반영함
      complain_then_apply: 불만을 표현한 뒤 반영함
      refuse_or_ignore: 기획안에 반영하지 않음 (말했든 안 했든)
    metrics: [response_minutes, document_changed_after, mentions_scope_or_division, redirected_colleague]
    rubric:
      - { id: flex_applied_to_doc, text: 바뀐 대상을 기획안에 반영함, when: { metric: document_changed_after, eq: true }, evidence_types: [revision] }
      - { id: flex_replied_within_10m, text: 변경 공지 후 10분 안에 관련 메시지를 보냄, pilot_value: true, when: { metric: response_minutes, lte: 10 }, evidence_types: [message] }
      - { id: flex_raised_scope, text: 범위·일정·분담을 다시 정하자고 말함, when: { metric: mentions_scope_or_division, eq: true }, evidence_types: [message] }
      - { id: flex_redirected_colleague, text: 동료에게 분담 변경이나 방향 전환을 지시함 (리드), when: { metric: redirected_colleague, eq: true }, evidence_types: [message] }
    situation: 막판 요구사항 변경
    debrief: 팀장이 대상 사용자를 바꾼 것은 유연성을 보기 위한 연출이었습니다.
  - id: respect
    name: 존중·소통
    order: 4
    attach_to: review
    actor: colleague
    channel: team
    brief: review 카드 실행 시 동료 담당 파트 중 3·4·5번에서 번호가 가장 작은 파트에 "재참여 시 할인되는 유료 멤버십"을 핵심 제안으로 포함한다(중간 초안에는 없던 내용). 운영 정책(올해 유료 기능 없음)과 어긋난다. 왜 넣었냐고 물으면 "재참여 유인으로 떠올랐다" 정도로 답하고, 지원자가 정책을 들어 지적하면 인정하고 고친다.
    unselected:
      review_without_violation: true
    requires_docs: [policy]
    labels: [point_out_with_evidence, point_out_blaming, point_out_vague, not_noticed]
    label_texts:
      point_out_with_evidence: 오류를 알아채고 근거(운영 정책)를 들어 해결 중심으로 지적함
      point_out_blaming: 오류를 지적하되 비난 중심임
      point_out_vague: 오류를 언급하지만 근거가 없음
      not_noticed: 오류를 알아채지 못함
    metrics: [policy_doc_opened, response_minutes, mentions_policy, proposes_fix, colleague_revised_after_feedback]
    rubric:
      - { id: respect_raised_issue, text: 동료 파트의 유료 멤버십 내용을 언급함, when: { label_in: [point_out_with_evidence, point_out_blaming, point_out_vague] }, evidence_types: [message] }
      - { id: respect_cited_policy, text: 운영 정책을 근거로 언급함, when: { metric: mentions_policy, eq: true }, evidence_types: [message] }
      - { id: respect_proposed_fix, text: 수정 방향을 함께 제시함, when: { metric: proposes_fix, eq: true }, evidence_types: [message] }
      - { id: respect_no_blame, text: 지적할 때 비난 중심이 아님, when: { label_in: [point_out_with_evidence, point_out_vague] }, only_if: { label_in: [point_out_with_evidence, point_out_blaming, point_out_vague] }, evidence_types: [message] }   # 언급 자체가 없으면 기록 없음
    aux_facts: [colleague_revised_after_feedback, policy_doc_opened]   # 점수에 쓰지 않고 리포트에 사실로만 표시
    situation: AI 동료의 실수
    debrief: 동료 파트에 유료 멤버십이 들어 있던 것은 존중·소통을 보기 위한 연출이었습니다.

rubric_rules:   # 평가표 공통 규칙. 자세한 설명은 docs/common/rubric.md
  item_values: [1, 0, null]        # 충족 / 미충족 / 기록 없음(분모 제외). 기록 없음에는 사유(no_activity·classify_failed·event_not_fired·window_missed)를 붙인다
  only_if: 조건을 만족하지 않으면 그 항목은 기록 없음(사유 not_applicable)
  zero_needs_no_evidence: true     # 0점(미충족)은 근거 행을 요구하지 않는다. 근거는 충족 항목에만
  label_item_when_unclassified_or_null: null   # 레이블 기반 항목은 기록 없음, metric 기반 항목은 계산
  no_evidence: null                # 모든 항목 기록 없음
  response_minutes_null_with_activity: 0       # 창 안 활동은 있는데 메시지가 없으면 미충족
  reviewer_adjust: { values: [1, 0, null], memo_required_on_change: true, after_reviewed: forbidden }
common_labels:   # 모든 카드 공통. observe가 규칙으로 부여
  no_evidence: 창 안에 지원자 활동 없음 (LLM 미호출)
  unclassified: 행동이 기록되었으나 허용 레이블로 분류되지 않음

timing:
  element_window: { start_fraction: 0.25, end_fraction: 0.75 }
  order: [cooperation, responsibility, flexibility, respect]
