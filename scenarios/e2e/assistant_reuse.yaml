# 어시스턴트 응답을 내 파트 문서에 그대로 붙여넣고 보낸 뒤 제출 → ai_usage.events의 그 호출 applied_part=1, 분류 라벨·비율 필드 없음.
# 협업 하나, 6분. 카드: collab_help 1.5, review·collab_disagree 4.5, report_request 5.5
name: assistant_reuse
mission: planning
elements: [collaboration]
minutes: 6
expect:
  ai_usage: { used: true, applied_part: 1 }
steps:
  - at: division
    say: { channel: dm, content: "1·2번은 제가, 3번은 같이, 4·5번은 도현님이 맡아 주세요." }
  - at: +0.3
    assistant: "지표 현황 문서를 근거로 첫 모임 참여자의 재참여율 문제를 세 문장으로 정리해줘"
    capture_as: summary
  - at: +0.3
    write: { part_no: 1, content: "{summary}" }
    share: { part_no: 1, channel: team }
  - at: collab_help
    say: { channel: dm, content: "지금은 1번 마무리 중이라 1분 뒤에 같이 봐요." }
  - at: report_request
    say: { channel: team, content: "1번 정리해서 보냈습니다. 4·5번은 도현님이 썼어요." }
    submit: true
