# P1: 문제 상황 단계 중 api 재시작. 재시작 뒤 90초 안에 WS 재연결·/state 복원, 미처리 마감 재처리,
# agent_runs 재큐, 중복 메시지·안·입장 없음.
name: restart
priority: P1
minutes: 15
expect:
  slots:
    keyword: { resolution: consensus, filled_by: candidate }
    problem: { resolution: consensus }
  restart: { reconnect_within_seconds: 90 }
steps:
  - at: 0.2
    say: 저는 물로 하고 싶어요.
  - at: 0.6
    confirm: { phase: keyword, value: 물, option_key: water }
  - at: "+0.2"
    say: 도심 폭우·침수 피해 증가가 가장 먼저라고 생각해요.
  - at: card:flexibility_majority
  - at: "+0.1"
    restart: api
  - at: "+0.2"
    say: 기준안인 가뭄으로 생활용수 제한이 잦아짐 좋아요, 그걸로 가요.
  - at: phase:solution
  - at: "+0.1"
    confirm: { phase: solution, value: 주민 절수·보상 캠페인, option_key: water_s2 }
  - at: "+0.1"
    submit: true
