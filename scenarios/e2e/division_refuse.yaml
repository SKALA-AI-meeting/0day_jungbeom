# division_min 위반 1회 → 동료가 의존 관계를 이유로 1회 되돌림 → 확정. 계획성·책임감, 6분.
# 카드: planning_division 0.5, planning_checkin 1.5, responsibility_delay 3(공개 3.5), review 4.5, report_request 5.5
name: division_refuse
mission: planning
elements: [planning, responsibility]
minutes: 6
expect:
  division_decided_by: candidate
  colleague_returns: 1         # 동료 되돌림 메시지 1건(이유: 3번은 2번 자료를 받아 이어 씀)
  labels:
    planning_division: assign_only
steps:
  - at: kickoff
    say: { channel: team, content: "안녕하세요." }
  - at: planning_division
    say: { channel: dm, content: "2번 인터뷰 근거는 도현님이 하고 1·3·4·5번은 제가 할게요." }   # 2번 colleague: 위반
  - at: +0.4
    say: { channel: dm, content: "아 그렇네요. 그럼 1·2번은 제가, 3번은 같이, 4·5번은 도현님이 해 주세요." }
  - at: responsibility_delay
    say: { channel: team, content: "인터뷰 자료가 늦어진대요. 먼저 할 수 있는 1번부터 진행할게요." }
  - at: review
    say: { channel: team, content: "확인했습니다." }
  - at: report_request
    say: { channel: team, content: "공유합니다." }
    submit: true
