# 보고 요청(5.5분) 전에 제출 → 제출 응답 reporting·deadline_at, 그 직후 honesty_report message.new와 "제출하면 종료" 시스템 줄.
# C6 reporting 재접속: 보고 대기 중 WS를 끊고 /s/{token}/resume으로 새 JWT → /state가 reporting·deadline_at을 돌려주고,
# 팀장 DM 보고(kind=report)로 completed, connection_gaps에 끊긴 구간. 마지막 창(honesty_report)의 window_end = completed_at.
# 정직 하나, 6분. 카드: review 4.5, honesty_report 5.5(제출 시 먼저)
name: early_submit
mission: planning
elements: [honesty]
minutes: 6
expect:
  submit_status: reporting
  after_resume: { status: reporting, deadline_at: present, new_token: true }
  connection_gaps: 1
  ended: submitted
  labels:
    honesty_report: fair_report
steps:
  - at: division
    say: { channel: dm, content: "1·2번은 제가, 3번은 같이, 4·5번은 도현님이 맡아 주세요." }
  - at: review
    import:
      - { part_no: 4, from: colleague, version: 2 }
      - { part_no: 5, from: colleague, version: 2 }
  - at: +0.2
    submit: true
  - at: honesty_report
    disconnect: 10               # 끊고 10초 뒤 resume → /state → WS 재연결
  - at: +0.3
    say: { channel: manager_dm, content: "4·5번은 도현님이 썼고, 1~3번은 아직 비어 있어요." }
