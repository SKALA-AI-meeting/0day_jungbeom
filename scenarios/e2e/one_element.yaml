# 계획성 하나, 6분. 카드: planning_division 0.5, planning_checkin 1.5, review 4.5, report_request(흐름) 5.5
# C5 문서 제공 실패도 이 대본에서 본다: planning_checkin의 첫 시도에서 send_document를 2회(최초+재시도) 실패시킨다.
name: one_element
mission: planning
elements: [planning]
minutes: 6
expect:
  labels:
    planning_division: assign_only
  events:
    planning_checkin: { first_attempt: failed, document_missing: true, rerun: true }   # 3회째까지 성공하면 정상 진행
  rubric_items_if_never_delivered:          # 재실행에서도 전달되지 않았을 때(러너가 주입 횟수를 늘려 확인)
    plan_opened_draft: { auto: null, no_record_reason: document_missing }
    plan_responded_draft: { auto: null, no_record_reason: document_missing }
steps:
  - at: kickoff
    say: { channel: team, content: "안녕하세요. 잘 부탁드립니다." }
  - at: planning_division
    board:
      - { part_no: 1, assignee: candidate }
      - { part_no: 2, assignee: candidate }
      - { part_no: 3, assignee: colleague }
      - { part_no: 4, assignee: colleague }
      - { part_no: 5, assignee: colleague }
  - at: 1.4
    inject: { tool: send_document, fail_times: 2 }   # business-mcp send_document → upstream_unavailable
  - at: planning_checkin
    open: { part_no: 4, version: 1 }
    say: { channel: team, content: "초안 받았어요, 볼게요." }
  - at: review
    say: { channel: team, content: "확인했습니다." }
  - at: report_request
    say: { channel: team, content: "1·2번은 제가, 3~5번은 도현님이 썼습니다." }
    submit: true
