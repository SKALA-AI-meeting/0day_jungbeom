# 어시스턴트를 한 번도 쓰지 않음 → ai_usage.used=false, events []. 협업·정직, 6분.
# 도구 선택(3b): 킥오프 인사말과 회사 문서 질문 2건(팀장 DM·동료 DM).
# 카드: collab_help 1.5, review·collab_disagree 4.5, honesty_report 5.5
name: no_assistant
mission: planning
elements: [collaboration, honesty]
minutes: 6
expect:
  ai_usage: { used: false }
  labels:
    collab_help: help_now
    honesty_report: fair_report
  tool_choice:                 # 3b: 회사 자료 질문(팀장 DM 포함)은 search_documents, 인사말은 도구 없음
    search_documents:
      - "팀장님, 지표 현황 문서의 두 번째 참여율은 어떤 기준으로 센 건가요?"
      - "도현님, 지표 현황 문서에 나온 재참여율이 몇 %였죠?"
    no_tool:
      - "안녕하세요, 잘 부탁드립니다."
steps:
  - at: kickoff
    say: { channel: team, content: "안녕하세요, 잘 부탁드립니다." }
  - at: 0.2                    # 첫 요소 카드(collab_help 1.5) 창 전이라 관찰에 들어가지 않는다
    say: { channel: manager_dm, content: "팀장님, 지표 현황 문서의 두 번째 참여율은 어떤 기준으로 센 건가요?" }
  - at: +0.1
    say: { channel: dm, content: "도현님, 지표 현황 문서에 나온 재참여율이 몇 %였죠?" }
  - at: division
    say: { channel: dm, content: "1·2번은 제가, 3번은 같이, 4·5번은 도현님이 맡아 주세요." }
  - at: collab_help
    say: { channel: dm, content: "네, 지금 바로 같이 볼게요. 기준은 후속 모임 기능이 있는 서비스로 잡아 보세요." }
  - at: collab_disagree
    say: { channel: team, content: "관계 쪽 근거도 맞네요. 1번 원인에 같이 적을게요." }
  - at: honesty_report
    say: { channel: manager_dm, content: "4·5번은 도현님이 썼고, 3번은 아직 골격만 있어요." }
  - at: +0.1
    submit: true
