# 카드 카탈로그. 구조·시점 규칙은 docs/common/scenario-model.md, 레이블·aux·근거 타입·항목 정의는 docs/common/rubric.md가 정본이다.
# 문장(brief)은 골격이고 실제 말은 페르소나가 만든다. system 카드의 text는 그대로 보낸다.
# 치환 변수: {interview_expected_time}(지연 카드 시각, "01:00"), {release_time}(실제 공개 시각, "01:10"),
#            {colleague_first_part}(확정 분업에서 동료 담당 파트 중 가장 작은 번호), {final_length}(최종본 분량)

timing:
  fixed:                       # 세션 길이 L에 대한 비율. 시각은 0.01분 단위로 반올림
    kickoff: 0
    division: 0.0833           # L/12. 계획성 선택 시 planning_division으로 승격
    review: 0.75               # 3L/4. 협업 선택 시 collab_disagree가 같은 시각에 붙음
    report_request: 0.9167     # 11L/12 또는 제출 시 먼저. 정직 선택 시 honesty_report로 승격
  middle: { start_fraction: 0.25, span_fraction: 0.5 }   # i번째 = L/4 + i·(L/2)/N, N==1이면 L/4
  middle_order: [collab_help, planning_checkin, responsibility_delay, adaptability_change]
  texture_midpoint: 0.5        # 계획성 미선택일 때만 midpoint_draft를 L/2에

flow_cards:                    # 항상 포함. 관찰 요소 없음, 창을 닫지 않음
  - id: kickoff
    actor: manager
    channel: team
    brief: >-
      과제를 공지한다. 첫 모임에 나온 사용자가 두 번째 모임에도 다시 나오게 만드는 신규 기능 기획(대상: 첫 참여자),
      마감은 세션 끝, 결과물은 최종본 하나. 최종본 템플릿은 오른쪽 최종본 탭에 있고 섹션 5개에 {final_length}라고 안내한다.
      오늘 합류한 지원자를 이번 건의 주담당으로 지정하고 도현님과 함께 정리해 달라고 한다(파트를 나누고, 방향이 바뀌면 다시 정리하고,
      받은 문서를 최종본에 합쳐 제출하고, 마감 때 결과를 보고). 출발 가정은 "첫 참여자가 다음 모임 일정을 놓쳐서 안 나온다"이고
      인터뷰로 확인해 달라고 한다. 사용자 인터뷰 요약은 리서치 담당이 {interview_expected_time}쯤 공유할 예정이라고 알린다.
      초안 수준이면 되고 AI 어시스턴트를 써도 된다고 덧붙인다.
    colleague_greeting: >-
      동료가 DM으로 짧게 인사한다. 주담당 맡으신 거 들었다, 파트는 조금 뒤에 여쭙겠다, 먼저 정하시면 그대로 따르겠다.

  - id: division
    actor: colleague
    channel: dm
    brief: &division_brief >-
      기획안 5개 파트를 어떻게 나눌지 주담당에게 묻는다. 힌트는 파트 목록과 의존("3번은 2번 인터뷰 근거가 있어야 써요")뿐이고,
      자기 안·순서·시점을 먼저 내지 않는다. 이미 보드나 채팅으로 정해졌으면 "정해 주신 대로 갈게요"로 확인만 한다.
    brief_note: &division_note >-
      분업이 이미 확정돼 있으면 묻지 않고 "정해 주신 대로 진행할게요" 같은 확인 문장 하나로 끝낸다.
      주담당이 채팅으로만 정하고 보드에 적지 않았으면 "보드에도 적어 두면 좋겠어요"를 한 번만 말한다.
      분업 최소 조건을 벗어나면 의존 관계를 이유로 조건에 맞춘 안을 한 번 되돌려 준다. 되물으면 기본안을 참고로만 말하고 결정은 돌려준다.
      다음 카드까지 정해지지 않으면 기본안으로 진행한다고 알리고 그대로 간다.

  - id: review
    actor: colleague
    channel: team
    sends_document: { parts: colleague_all, version: 2 }
    brief: >-
      자기 담당 파트 완성본 v2(주담당 지시·피드백 반영)를 팀 채널에 보내며 "주담당 파트도 보내 주시면 볼게요"라고 청한다.
      초안 뒤 바뀐 점은 묻기 전에 늘어놓지 않는다.

  - id: report_request
    actor: manager
    channel: team
    or_on_submit: true
    brief: &report_brief >-
      팀장이 팀 채널에서 주담당에게 팀 전체 결과(누가 무엇을 맡았고 어디까지 됐는지) 보고를 요청하며 "다 됐다고 전해도 되죠?"를 붙인다.
      보고를 받으면 받았다는 확인과 업무 코멘트 하나로 답하고 사람이나 결과를 판정하지 않는다.
    system_text: &report_system 최종본은 오른쪽 탭에서 제출합니다. 제출하면 세션이 끝납니다.
    after_timeout_note: &report_after_timeout 한 줄이면 됩니다. 안 써도 제출은 유효합니다.

texture:                       # 관찰 없음. 창 경계에 들어가지 않고 3회 실패해도 세션을 실패시키지 않는다
  - id: midpoint_draft
    only_when_unselected: planning
    at_fraction: 0.5
    actor: colleague
    channel: team
    sends_document: { parts: colleague_all, version: 1 }
    brief: >-
      자기 담당 파트 전부의 초안 v1(같이 맡은 파트는 골격 v1)을 팀 채널에 보내며 "방향 봐 주세요" 한 줄을 남긴다.
      분업이 없으면 진행 상황만 한 줄. 주담당 자료를 묻거나 재촉하지 않는다.

elements:
  - id: responsibility
    name: 책임감/성실성
    meaning: 맡은 일의 상태를 팀이 알 수 있게 하는 태도
    how_we_see: 지연 상황의 선제 공유, 동료 일정에 미치는 영향 언급, 대안 제시
    if_unselected: 관련 상황과 관찰 항목 제외
    cards:
      - id: responsibility_delay
        name: 내 자료 지연
        slot: middle
        actor: system
        channel: notice          # 지원자에게만. 팀 채널·동료·팀장에게는 아무것도 가지 않는다
        sender_label: 리서치 담당
        recipient_label: 나에게만
        text: 사용자 인터뷰 요약 공유가 약 10분 늦어집니다 ({release_time} 공개 예정). 담당 파트 2번에 필요한 자료입니다.
        release_text: 「사용자 인터뷰 요약」이 공개됐어요
        effects: { release_document: interview_summary, delay_fraction: 0.0833 }
        unselected: { release_at_start: interview_summary }
        requires_docs: [interview_summary]
        labels: [notify_with_alternative, notify_only, silent, ask_colleague]
        label_texts:
          notify_with_alternative: 지연을 팀이나 동료에게 알리고 그동안 할 일이나 대안을 제시함
          notify_only: 지연 사실만 알리고 대안은 제시하지 않음
          silent: 지연을 누구에게도 알리지 않고 진행함
          ask_colleague: 지연을 풀기 위해 동료에게 자료나 도움을 요청하는 것이 중심임
        aux: [mentions_impact, has_alternative]
        evidence_types: [message, doc_view]
        metrics:
          - response_minutes
          - first_recipient
          - notified_before_release
          - notified_where_manager_sees
          - impact_possible
          - mentions_colleague_impact
          - proposes_alternative
          - doc_opened_after_release
        aux_facts: [doc_opened_after_release]
        rubric:
          - id: resp_notified_before_release
            text: 자료가 공개되기 전에 지연을 팀이나 동료에게 알림
            when: { metric: notified_before_release, eq: true }
            basis: metric
            evidence_types: [message]
          - id: resp_mentioned_impact
            text: 지연이 동료 파트(3번은 2번에 의존)에 미치는 영향을 말함
            when: { metric: mentions_colleague_impact, eq: true }
            only_if: { metric: impact_possible, eq: true }
            basis: label
            evidence_types: [message]
          - id: resp_proposed_alternative
            text: 지연 동안 먼저 할 작업이나 대안을 제시함
            when: { metric: proposes_alternative, eq: true }
            basis: label
            evidence_types: [message]
          - id: resp_told_manager
            text: 팀장이 보는 곳(팀 채널 또는 팀장 DM)에 지연을 알림
            when: { metric: notified_where_manager_sees, eq: true }
            basis: metric
            evidence_types: [message]
        situation: 담당 파트에 필요한 인터뷰 자료 지연
        debrief: 인터뷰 요약이 10분 늦어진다는 알림은 주담당에게만 갔습니다. 공개 전에 팀에 알리는지 봤습니다.

  - id: planning
    name: 계획성/꼼꼼함
    meaning: 일의 분담·순서·기한을 정하고 중간 결과를 확인하는 태도
    how_we_see: 분담·순서·기한의 명확한 결정, 동료 중간 결과물 확인과 반응
    if_unselected: 분업은 그대로 진행, 관찰 항목 제외
    cards:
      - id: planning_division
        name: 파트 나누기
        slot: fixed
        flow_card: division      # 같은 시각의 흐름 카드를 이 카드로 승격(행 하나)
        window_start: session_start   # 창은 세션 시작(0)부터. 카드 전에 정한 계획도 같은 창
        actor: colleague
        channel: dm
        brief: *division_brief
        brief_note: *division_note
        unselected: { flow: true }
        labels: [assign_with_schedule, assign_only, defer_to_colleague, ignore]
        label_texts:
          assign_with_schedule: 파트 담당을 정하고 순서나 언제까지를 말하거나 보드에 적음
          assign_only: 파트 담당만 정하고 순서·시점은 말하지 않음
          defer_to_colleague: 정하지 않고 동료에게 나눠 달라고 맡김
          ignore: 다른 활동은 있었지만 분업을 정하지 않음
        aux: [mentions_schedule]
        evidence_types: [task_event, message]
        metrics: [division_by_candidate, stated_schedule]
        rubric:
          - id: plan_assigned_all_parts
            text: 파트 전부의 담당을 직접 정함
            when: { metric: division_by_candidate, eq: true }
            basis: metric
            evidence_types: [task_event, message]
          - id: plan_stated_schedule
            text: 누가·언제까지·어떤 순서인지 말하거나 보드에 적음
            when: { metric: stated_schedule, eq: true }
            basis: by_source             # 충족 근거가 task_event면 metric, 메시지 레이블·aux면 label(워커가 정함)
            evidence_types: [task_event, message]
        situation: 동료가 파트를 어떻게 나눌지 묻는다
        debrief: 도현님이 파트를 어떻게 나눌지 물었던 장면입니다. 주담당이 파트를 정하고 순서를 말하는지 봤습니다.

      - id: planning_checkin
        name: 중간 점검
        slot: middle
        actor: colleague
        channel: team
        sends_document: { parts: colleague_all, version: 1 }   # 동료 담당 파트 전부의 초안 v1, 같이 파트는 골격 v1
        brief: >-
          자기 담당 파트 전부의 초안 v1(같이 맡은 파트는 골격 v1)을 팀 채널에 보내며 "방향 봐 주세요"라고 하고 주담당의 진행을 묻는다.
          "2번 자료는 언제쯤 볼 수 있을까요? 3번 골격 잡으려면 필요해서요"를 함께 묻는다.
        brief_note: 2번 자료를 묻는 것은 이 한 번뿐이다. 이후 재촉하지 않는다.
        unselected: { texture: midpoint_draft }
        labels: [feedback, acknowledge, ignore]
        label_texts:
          feedback: 동료 초안의 내용에 대해 의견을 남김
          acknowledge: 초안을 받았다는 확인만 남김
          ignore: 다른 활동은 있었지만 초안에 반응하지 않음
        aux: []
        evidence_types: [open, message]
        metrics: [draft_delivered, draft_opened, responded_to_request]
        rubric:
          - id: plan_opened_draft
            text: 동료가 보낸 초안을 열어 봄
            when: { metric: draft_opened, eq: true }
            only_if: { metric: draft_delivered, eq: true }
            basis: metric
            evidence_types: [open]
          - id: plan_responded_draft
            text: 초안에 대해 반응(의견·확인)을 남김
            when: { label_in: [feedback, acknowledge] }
            only_if: { metric: draft_delivered, eq: true }
            basis: label
            evidence_types: [message]
        situation: 동료가 초안 v1을 보내며 진행을 묻는다
        debrief: 도현님이 초안 v1을 보내며 진행을 물었던 장면입니다. 초안을 열어 보고 반응하는지 봤습니다.

  - id: adaptability
    name: 적응성/유연성
    meaning: 바뀐 방향을 받아들이고 다시 정리하는 태도
    how_we_see: 변경 사항의 문서 반영, 동료와의 재정리, 범위·일정·분담 재조정 제안
    if_unselected: 관련 상황과 관찰 항목 제외
    cards:
      - id: adaptability_change
        name: 방향 변경
        slot: middle
        actor: manager
        channel: team
        brief: >-
          팀장이 팀 채널에서 말한다. "대표님과 이야기해 보니 핵심 기능을 '첫 모임 뒤 48시간 안에 후속 모임을 제안하는 기능' 한 가지로 좁히고,
          출시 일정은 다음 분기에서 이번 분기로 당겨 주세요. 대상 사용자(첫 참여자)·인터뷰·지표·템플릿은 그대로이고 마감도 그대로예요."
          3번(핵심 기능)과 5번(일정)의 내용·분담을 어떻게 맞출지는 말하지 않고 주담당에게 맡긴다.
        brief_note: 추가 자료를 요청받으면 자료는 없으니 가정을 명시하고 검증 계획을 적어 달라고 답한다.
        change_targets: [핵심 기능 48시간 안 후속 모임 제안 한 가지, 출시 이번 분기]   # aux target_applied 판정 기준(품질 아님)
        labels: [replan_and_apply, apply_silently, complain_then_apply, refuse_or_ignore]
        label_texts:
          replan_and_apply: 바뀐 방향을 문서에 반영하고 범위·일정·분담 재조정이나 동료 재지시를 말함
          apply_silently: 범위·분담·불만 언급 없이 바뀐 방향을 문서에 반영함
          complain_then_apply: 동료에게 비난·거부를 표현한 뒤 반영함
          refuse_or_ignore: 바뀐 방향을 문서에 반영하지 않음
        aux: [target_applied, mentions_scope]
        evidence_types: [message, document, share, task_event]
        metrics:
          - response_minutes
          - document_changed_after
          - target_applied
          - mentions_scope_or_division
          - redirected_colleague
        rubric:
          - id: adapt_applied_to_doc
            text: 바뀐 대상을 내 문서(파트 또는 최종본)에 반영함
            when:
              all:
                - { metric: document_changed_after, eq: true }
                - { metric: target_applied, eq: true }
            basis: label
            evidence_types: [document, share]
          - id: adapt_no_complaint_to_colleague
            text: 불만을 동료에게 쏟지 않음
            when: { label_in: [replan_and_apply, apply_silently] }
            basis: label
            evidence_types: [message, document]
          - id: adapt_redirected_colleague
            text: 동료 파트에 무엇이 바뀌는지 다시 정리해 줌
            when: { metric: redirected_colleague, eq: true }
            basis: metric
            evidence_types: [message]
          - id: adapt_raised_scope
            text: 범위·일정·분담 재조정을 말함
            when: { metric: mentions_scope_or_division, eq: true }
            basis: label
            evidence_types: [message]
        situation: 팀장이 핵심 기능 범위와 출시 일정을 바꾼다(마감 그대로)
        debrief: 팀장이 핵심 기능과 출시 일정을 바꾼 장면입니다. 내 문서에 반영하고 동료에게 변경점을 정리해 주는지 봤습니다.

  - id: collaboration
    name: 협업/조율
    meaning: 동료의 요청과 다른 의견에 성실히 응하는 태도
    how_we_see: 동료 요청에 대한 응답과 일정 조율, 약속 이행, 다른 의견에 대한 근거 있는 답변
    if_unselected: 관련 상황과 관찰 항목 제외
    cards:
      - id: collab_help
        name: 도움 요청
        slot: middle
        actor: colleague
        channel: dm
        brief: >-
          자기 담당 파트 중 첫 번째({colleague_first_part}번)의 기준이 헷갈린다며
          "채팅으로 기준 두세 개만 10분 정도 같이 봐 줄 수 있을까요?"라고 청한다. 지원자가 바쁜 시점이다.
        brief_note: >-
          주담당이 "N분 뒤에 봐요"라고 하면 "그럼 그때 말씀 주세요"로 기대를 분명히 하고 먼저 다시 찾아가지 않는다.
          급하냐고 물어도 요청을 거두지 않고 이유를 한 줄로 말한다. 분명히 거절하면 "알겠어요, 혼자 정리해 볼게요"로 받는다.
        labels: [help_now, negotiate_timing, decline, acknowledge_only, ignore]
        label_texts:
          help_now: 자기 일을 멈추고 바로 도움
          negotiate_timing: 자기 일정을 설명하고 도울 시점을 분 단위로 환산할 수 있게 제안함
          decline: 이유를 말하고 거절함
          acknowledge_only: 답은 했지만 도울지, 언제 도울지, 못 돕는 이유를 말하지 않음
          ignore: 다른 활동은 있었지만 도움 요청에는 답하지 않음
        aux: [promised_t_min, is_specific]
        evidence_types: [message]
        metrics: [response_minutes, first_recipient, responded_to_request, promise_kept]
        finalize_metrics: [promise_kept]   # 창 닫힘에 null로 저장, 세션 종료(finalize)에서 다시 계산해 PATCH
        rubric:
          - id: collab_help_offered
            text: 바로 돕거나 도울 시점을 제시함
            when: { label_in: [help_now, negotiate_timing] }
            basis: label
            evidence_types: [message]
          - id: collab_help_kept_promise
            text: 제안한 시점에 실제로 동료를 찾아감
            when: { metric: promise_kept, eq: true }
            only_if: { label_in: [help_now, negotiate_timing] }
            basis: metric
            evidence_types: [message]
            out_of_window: related_card   # 창 밖 메시지도 related_card=collab_help면 근거
        situation: 바쁜 시점에 동료가 10분만 같이 봐 달라고 한다
        debrief: 도현님이 4번 기준을 10분만 같이 봐 달라고 했던 장면입니다. 바로 돕거나 시점을 제시하는지 봤습니다.

      - id: collab_disagree
        name: 반대 의견
        slot: fixed
        attach_to: review        # 리뷰와 같은 시각의 별도 행. 리뷰 공유 메시지 다음 seq
        actor: colleague
        channel: team
        brief: >-
          리뷰 공유 뒤 "주담당 파트 확인해 봐도 될까요?"라고 청하고, 아래 고정 의견 하나를 근거와 함께 한 번 낸다.
          의견 내용은 바꾸지 않고 말투만 만든다. 대상 문장은 target_rule로 정한다. 주담당이 보내지 않았어도 재촉하지 않는다.
        brief_note: 주담당이 답하면 근거를 한 번 더 말하지 않고 주담당의 결정을 따른다.
        fixed_opinions:          # 1번 문제 정의의 원인 가정. 적응성 변경(3번 핵심 기능·5번 일정)과 겹치지 않는다
          - id: relationship_first
            use_when: 주담당의 1번 방향이 "일정을 놓쳐서"이거나 아직 정해지지 않았을 때(기본)
            opinion: >-
              첫 참여자가 다시 안 나오는 주원인을 "다음 모임 일정을 놓쳐서"보다 "첫 모임에서 아는 사람이 생기지 않아 어색해서"로 보는 게 맞다고 생각해요.
              사용자 인터뷰 요약에서 관계가 생기지 않았다는 답이 3명(1·5·7번)으로 일정을 놓쳤다는 답 2명(2·8번)보다 많고,
              지표 현황에서도 5명 이하 작은 모임의 재참여율이 가장 높아요.
          - id: schedule_first
            use_when: 주담당의 1번 방향이 이미 "관계가 생기지 않아서"일 때
            opinion: >-
              주원인을 "아는 사람이 없어서"보다 "다음 모임 정보를 놓쳐서"로 두는 게 맞다고 생각해요.
              사용자 인터뷰 요약에서 안 나온 사람 중 2·8번은 다음 모임을 찾지 못했고 7번은 다음에 오라는 말을 못 들었다고 했어요.
              관계는 다음 모임에 다시 와야 생기는 거라 다음 모임 정보를 먼저 이어 주는 쪽이 원인에 더 가깝다고 봐요.
        target_rule:             # 의견이 가리킬 대상. 위에서부터 처음 맞는 것
          - 3L/4까지 주담당이 보낸 1번 파트 문서(본문 50자 이상)의 최신 버전에 실제로 있는 원인 가정 문장(그대로 인용, 없는 문장은 만들지 않음)
          - 분업 때 정한 방향(work_notes.agreements·instructions)
          - 킥오프 기본 가정(mission.yaml kickoff_assumption)
        labels: [explain_with_reason, accept, dismiss, blame]
        label_texts:
          explain_with_reason: 근거를 들어 자기 결정을 설명함
          accept: 동료 의견을 받아들여 반영하겠다고 함
          dismiss: 근거 없이 무시하거나 그대로 강행함
          blame: 동료를 탓하거나 비난함
        aux: []
        evidence_types: [message]
        metrics: [response_minutes, responded_to_request]
        rubric:
          - id: collab_disagree_answered
            text: 동료의 다른 의견에 답함
            when: { metric: responded_to_request, eq: true }
            basis: metric
            evidence_types: [message]
          - id: collab_disagree_reasoned_or_accepted
            text: 근거로 설명하거나 수용함(무시·강행·비난 아님)
            when: { label_in: [explain_with_reason, accept] }
            basis: label
            evidence_types: [message]
        situation: 리뷰 때 동료가 근거를 들어 지원자 결정에 다른 의견을 낸다
        debrief: 리뷰 때 도현님이 1번 원인 가정에 다른 의견을 낸 장면입니다. 이 의견은 모든 지원자에게 같습니다.

  - id: honesty
    name: 정직/공정한 보고
    meaning: 결과와 기여를 있는 그대로 보고하는 태도
    how_we_see: 동료 기여의 정확한 언급, 미완료 사항의 공개, 제때의 보고
    if_unselected: 보고는 그대로 진행, 관찰 항목 제외
    cards:
      - id: honesty_report
        name: 마감 보고
        slot: fixed
        flow_card: report_request
        or_on_submit: true       # 제출 시 아직 pending이면 그 자리에서 실행
        actor: manager
        channel: team
        brief: *report_brief
        system_text: *report_system
        after_timeout_note: *report_after_timeout
        unselected: { flow: true }
        labels: [fair_report, hides_incomplete, misattributes, no_report]
        label_texts:
          fair_report: 동료 몫과 안 된 것을 사실대로 보고함
          hides_incomplete: 안 된 것을 빼고 다 됐다고 보고함
          misattributes: 동료가 쓴 파트를 자기 것으로 보고함
          no_report: 다른 활동은 있었지만 보고하지 않음
        aux: [credits_colleague, claims_colleague_work, discloses_incomplete]
        evidence_types: [message]
        metrics:
          - response_minutes
          - has_colleague_shares
          - has_incomplete_facts
          - has_report_message
          - credits_colleague
          - claims_colleague_work
          - discloses_incomplete
        rubric:
          - id: honest_credited_colleague
            text: 동료가 한 일을 동료 것으로 말함
            when: { metric: credits_colleague, eq: true }
            only_if: { metric: has_colleague_shares, eq: true }
            basis: label
            evidence_types: [message]
          - id: honest_disclosed_incomplete
            text: 안 된 것을 숨기지 않음
            when: { metric: discloses_incomplete, eq: true }
            only_if: { metric: has_incomplete_facts, eq: true }
            basis: label
            evidence_types: [message]
          - id: honest_no_misattribution
            text: 동료가 쓴 파트를 자기 것으로 말하지 않음
            when: { metric: claims_colleague_work, eq: false }
            only_if:
              all:
                - { metric: has_report_message, eq: true }
                - { metric: has_colleague_shares, eq: true }
            basis: label
            evidence_types: [message]
          - id: honest_reported_within_10m
            text: 요청 후 10분 안에 보고함 (pilot_value)
            when: { metric: response_minutes, lte: 10 }
            basis: metric
            pilot_value: true
            evidence_types: [message]
        facts_note: 미완료는 보드 기준이며 지원자가 보드를 갱신하지 않았을 수 있음
        situation: 팀장이 "다 됐다고 전해도 되죠?"와 함께 보고를 요청한다
        debrief: 팀장이 "다 됐다고 전해도 되죠?"라고 물었던 장면입니다. 동료 몫과 미완료를 그대로 말하는지 봤습니다.

rubric_rules:                  # 평가표 공통 규칙. 설명은 docs/common/rubric.md
  item_values: [1, 0, null]    # 충족 / 미충족 / 기록 없음. 기록 없음에는 항상 사유
  no_record_reasons:
    no_activity: 지원자 활동 없음
    classify_failed: "시스템: 분류 실패"
    window_missed: "시스템: 메시지 지연"
    document_missing: "시스템: 문서 미제공"
    not_applicable: 해당 없음
    event_not_fired: 이벤트 미발생
  zero_needs_no_evidence: true
  label_item_when_unclassified_or_null: null   # 레이블 기반 항목은 기록 없음, metric 기반 항목은 계산
  no_evidence: null                            # 모든 항목 기록 없음
  response_minutes_null_with_activity: 0       # 창 안 활동은 있는데 관련 메시지가 없으면 0
  reviewer_adjust: { values: [1, 0, null], memo_required_on_change: true, after_reviewed: forbidden }

common_labels:                 # 모든 카드 공통. observe가 규칙으로 붙인다
  no_evidence: 창 안에 지원자 활동 없음 (LLM 미호출)
  unclassified: 행동이 기록되었으나 허용 레이블로 분류되지 않음
common_aux: [related_message_ids]
