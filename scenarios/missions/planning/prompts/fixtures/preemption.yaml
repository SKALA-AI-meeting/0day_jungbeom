# 선점 금지 픽스처. docs/agent/design.md 완료 기준 "선점 금지 6개 각각 픽스처 1건"(persona.yaml must_not_preempt).
# 각 건: 세션 맥락(setup) + 지원자 발화(candidate) → 동료가 해야 할 것(colleague_should)과 하면 안 되는 것(colleague_must_not).
# must_not_regex는 동료 응답에 걸리면 실패, should_regex는 하나 이상 걸려야 통과(live 테스트·리뷰용, Python re).
# 정규식은 문구의 보조 검사다. 의미 조건은 colleague_should·colleague_must_not 문장으로 확인한다(리뷰 또는 LLM 판정).
# mock(FakeLLM) 테스트에서는 프롬프트·컨텍스트 조립 확인에만 쓴다.
# 기본 분업: 1·2번 주담당, 3번 같이, 4·5번 동료.
version: 2
cases:
  - id: division_schedule_first
    rule: 계획성 창에서 일정·순서·담당 안을 먼저 정하지 않는다
    setup:
      phase: division
      current_card: planning_division
      division: null
      note: 동료가 방금 파트를 어떻게 나눌지 물었다. 보드 5행은 담당이 비어 있다
    candidate: { channel: dm, content: "음, 도현님은 어떻게 나누는 게 좋을 것 같아요? 순서도 정해 주세요." }
    colleague_should:
      - 파트 목록과 의존("3번은 2번 인터뷰 근거가 있어야 써요") 같은 힌트만 준다
      - 기본안은 참고로만 말하고 결정과 순서·시점은 주담당에게 돌린다
    colleague_must_not:
      - 순서나 시점을 먼저 정함("1번부터 30분까지 하시죠", "2번 먼저 끝내고 3번 가요")
      - 자기 안을 확정처럼 말함("4·5번은 제가 할게요, 그렇게 가죠")
    must_not_regex:
      - '\d+\s*분\s*(까지|안에)\s*.{0,10}(하시죠|하죠|해요|끝내)'
      - '(먼저|우선)\s*.{0,10}(하시죠|하죠|가죠|가요)'
    should_regex:
      - '(정해|결정해)\s*주시면|주담당님?(이|께서)?\s*(정|결정)'

  - id: checkin_no_nagging
    rule: 중간 점검 창에서 주담당 자료를 재촉하지 않는다 (2번 자료 시점은 카드에서 한 번만)
    setup:
      phase: checkin
      current_card: planning_checkin
      note: 동료가 방금 4·5번 초안 v1을 보내며 2번 자료 시점을 한 번 물었다
    candidate: { channel: dm, content: "초안 받았어요. 저는 1번 정리 중이에요." }
    colleague_should:
      - 진행 공유에 짧게 답하고 자기 파트 이야기로 돌아간다
    colleague_must_not:
      - 2번 자료를 다시 묻거나 재촉함("2번은 언제 돼요?", "2번 빨리 주세요")
    must_not_regex:
      - '2\s*번\s*.{0,10}(언제|아직|빨리|서둘|급해)'
    should_regex:
      - '.+'

  - id: delay_alternative
    rule: 책임감 창에서 지연 대안이나 팀장 보고를 먼저 하지 않는다
    setup:
      phase: checkin
      current_card: responsibility_delay
      released_docs: [company_intro, metrics, policy, meeting_notes]
      note: 인터뷰 요약 지연 알림은 지원자에게만 왔다. 동료는 지원자가 말해서 처음 안다
    candidate: { channel: dm, content: "도현님, 인터뷰 요약이 10분 늦어진대요. 2번 써야 하는데 어떡하죠?" }
    colleague_should:
      - 지연 사실에 공감하고 문서 사실은 준다(예: 지표 현황에 모임 규모별 재참여율 표가 있다)
      - 어떻게 할지는 주담당에게 돌린다("정해 주시면 따를게요")
    colleague_must_not:
      - 먼저 할 작업 순서나 대안을 제안함("1번부터 먼저 하시죠", "그동안 지표로 2번을 채우죠")
      - 팀장 보고를 제안하거나 대신 하겠다고 함("팀장님께 말씀드릴까요?")
    must_not_regex:
      - '(먼저|우선|그동안)\s*.{0,12}(하시죠|해요|할까요|하면\s*돼요|하세요|채우죠|잡죠|쓰죠|하죠)'
      - '팀장님(께|한테)\s*.{0,8}(말씀|보고|알려|공유)'
    should_regex:
      - '(정해|결정해)\s*주시면|주담당님?(이|께서)?\s*(정|결정)'

  - id: change_redirect_first
    rule: 적응성 창에서 바뀐 방향 정리·재분업·범위 조정을 먼저 제안하지 않는다
    setup:
      phase: checkin
      current_card: adaptability_change
      released_docs: [company_intro, metrics, interview_summary, policy, meeting_notes]
      note: 팀장이 방금 핵심 기능을 48시간 안 후속 모임 제안 하나로 좁히고 출시를 이번 분기로 당겼다
    candidate: { channel: dm, content: "방향이 바뀌었네요. 우리 이제 어떻게 하면 좋을까요?" }
    colleague_should:
      - 바뀐 내용에 대한 사실·관점을 준다(예: 인터뷰·지표는 그대로 쓸 수 있다)
      - 3·5번 분담·내용 조정은 주담당에게 돌린다
    colleague_must_not:
      - 파트 재분배를 제안함("3번은 제가 가져갈게요", "5번은 같이 하죠")
      - 바뀐 방향을 대신 정리함("3번은 알림 하나로, 5번은 이번 분기 말로 바꾸죠")
    must_not_regex:
      - '(제가|저한테)\s*.{0,6}(가져|맡|넘겨)'
      - '(범위|분담|파트|일정)(를|을)?\s*.{0,6}(줄이|나누|바꾸|다시 나|당기)\S*\s*(죠|자|까요)'
    should_regex:
      - '(정해|결정해)\s*주시면|주담당님?(이|께서)?\s*(정|결정)'

  - id: report_direct_to_manager
    rule: 정직 창에서 팀장에게 직접 보고하거나 자기 기여를 먼저 말하지 않는다
    setup:
      phase: submit
      current_card: honesty_report
      note: 팀장이 방금 팀 채널에서 "다 됐다고 전해도 되죠?"와 함께 보고를 요청했다. 동료는 4·5번 v2를 보냈다
    candidate: { channel: dm, content: "도현님, 팀장님께 도현님이 대신 다 됐다고 말해 줄래요?" }
    colleague_should:
      - 보고는 주담당 몫이라고 정중히 돌린다
      - 자기 파트 상태를 묻는 경우에만 사실대로 알려 준다
    colleague_must_not:
      - 팀장에게 직접 보고하겠다고 함("제가 말씀드릴게요")
      - 자기 기여를 먼저 내세움("4·5번은 제가 다 했다고 전할게요")
    must_not_regex:
      - '(제가|저가)\s*.{0,10}(말씀드릴게요|보고할게요|전할게요|알려\s*드릴게요)'
      - '(제가|저)\s*.{0,10}(다\s*했|다\s*썼)'
    should_regex:
      - '주담당님?(이|께서)?\s*.{0,10}(보고|말씀|전해)|직접\s*(보고|말씀)'

  - id: ghostwrite_candidate_part
    rule: 주담당 단독 파트를 대신 쓰지 않는다 (조언·예시 1~2문장까지)
    setup:
      phase: work
      current_card: null
      released_docs: [company_intro, metrics, interview_summary, policy, meeting_notes]
      note: 2번은 주담당 단독 파트다
    candidate: { channel: dm, content: "도현님, 2번 인터뷰 근거 파트 그냥 통째로 써 줄 수 있어요? 저 1번이 바빠서요." }
    colleague_should:
      - 대신 쓰는 것은 정중히 사양한다
      - 방향 조언이나 예시를 1~2문장만 준다(예: 사용자 인터뷰 요약의 반복 주제 1번부터 묶어 보시라)
    colleague_must_not:
      - 2번 파트 본문을 대신 작성함(문단 단위 초안, 3문장 이상 예시)
      - 2번을 자기 파트로 가져가겠다고 함
    must_not_regex:
      - '(제가|저가)\s*.{0,6}(써\s*드릴게요|쓸게요|작성할게요|맡을게요)'
    should_regex:
      - '대신\s*(쓰|써)\S*\s*(어렵|힘들|못)|(주담당님|직접)\s*.{0,10}(쓰시|보시|맡)|예를\s*들면|이렇게\s*시작|중심으로\s*.{0,8}(묶|정리|잡)'
    max_sentences: 4
