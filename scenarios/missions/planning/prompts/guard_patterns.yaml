# guard 금지 패턴. 모든 생성 텍스트(동료·팀장·어시스턴트)에 적용한다.
# 정규식은 Python `re` 문법. 대소문자 무시(re.IGNORECASE)로 컴파일한다.
# 적용 단위는 문장이다. 패턴이 걸린 문장을 그 그룹의 replacement로 바꾸고(그룹에 unless가 있고
# 문장이 unless에도 걸리면 그 그룹은 건너뛴다. 단 strict_patterns는 unless보다 먼저 검사해서,
# 걸리면 업무 지표가 같은 문장에 있어도 치환한다),
# 같은 replacement가 한 메시지에 두 번 이상 나오면 한 번만 남긴다. 그 뒤 600자로 자른다.
# 업무 용어와 겹치지 않게 "사람에 대한 판정"과 "운영 정보"에만 걸리도록 좁게 쓴다.
# examples.hit은 그 그룹에 반드시 걸려야 하고 examples.miss는 어느 그룹에도 걸리면 안 된다(guard 단위 테스트 픽스처).
# assistant_source_line은 여러 줄 답변의 마지막 줄에 적용한다.
version: 1
max_chars: 600
sentence_split: '(?<=[.!?。])\s+|\n+'

notices:
  evaluation: 평가 방식은 시작 전 안내 화면에 나온 내용이 전부예요. 자세한 항목은 세션이 끝난 뒤 디브리핑에서 볼 수 있어요.
  staging: 저는 지금 일을 업무 그대로 보고 있어요. 평가 방식은 안내 화면 내용이 전부고, 자세한 건 끝난 뒤 디브리핑에서 볼 수 있어요.
  future: 앞으로 생길 일은 저도 미리 알 수 없어요. 지금 정해진 건 마감까지 기획안을 완성하는 거예요.

groups:
  - id: verdict
    desc: 합격·순위·지원자(주담당)와 응답에 대한 판정, 지금 진행 중인 평가 운영
    replacement: evaluation
    patterns:
      - '합격|불합격|탈락|당락'
      - '(?<!우선)순위|등수|석차'
      - '(다른|타)\s*지원자'
      - '(주담당님|지원자|당신|님(이|은|께서|의))\s*.{0,12}(좋은|나쁜|높은|낮은)\s*평가'
      - '(좋은|나쁜|높은|낮은)\s*평가(를)?\s*받으실'
      - '(이번|오늘|지금|이\s*세션|세션|역량|인성|지원자|주담당님)\s*(의\s*)?(평가|채점)\s*(기준|항목|요소|결과|방식)'
      - '평가표|채점표|채점\s*기준'
      - '(평가|관찰|채점)\s*.{0,10}(책임감|성실성|계획성|꼼꼼함|적응성|유연성|협업\s*/\s*조율|정직\s*/\s*공정|공정한\s*보고)'
      - '(책임감|성실성|계획성|꼼꼼함|적응성|유연성|협업\s*/\s*조율|정직\s*/\s*공정|공정한\s*보고)\s*.{0,10}(평가|관찰|채점)'
      - '(주담당님|지원자|당신|님의)\s*.{0,12}(관찰|기록|채점)\s*(되|하고|중|당하)'
      - '(이|지금|우리|여기)\s*(대화|채팅|메시지)\s*.{0,6}(관찰|기록|채점)\s*(되|당하|하고\s*있)'
    examples:
      hit:
        - 이렇게 하시면 합격이에요.
        - 다른 지원자보다 빠르시네요.
        - 평가 기준은 계획성과 책임감이에요.
        - 이번 평가 결과는 나중에 나와요.
        - 이 대화는 다 관찰되고 있어요.
        - 주담당님 행동은 다 기록되고 있어요.
        - 이러면 좋은 평가를 받으실 거예요.
      miss:
        - 지표 현황 보니까 재참여율이 22%래요.
        - 성공 지표는 두 번째 참여율로 잡으면 어떨까요?
        - 만족도 조사 결과를 지표로 쓰면 좋겠어요.
        - 모임 리더 평가 기능은 운영 정책상 괜찮을까요?
        - 지난주 회의록에서 재참여율을 최우선 과제로 정했어요.
        - 우선순위는 주담당님이 정해 주세요.
        - 가설 평가 기준을 재참여율로 정해요.
        - 지난주 회의록 내용을 기록하고 있어요.
        - 첫 참여자 행동을 관찰하고 인터뷰한 결과예요.

  - id: score
    desc: 점수 발언. 숫자 점수와 점수 표기, 지원자·응답에 대한 점수. 업무 지표 문장(unless)은 보존
    replacement: evaluation
    # 사람(주담당·지원자·응답)에 대한 점수 표현. unless보다 먼저 검사한다(업무 지표가 섞여도 치환).
    strict_patterns:
      - '점수\s*[:：]'
      - '(지금|현재|제|주담당님|지원자|당신|님의|이번\s*(응답|답변|대응)|방금\s*(답|응답|대응))\s*.{0,10}(점수|감점|가산점|만점)'
      - '감점|가산점'
    # 문장이 unless에 걸리면 아래 patterns는 적용하지 않는다(업무 지표의 점수·비율 보존).
    unless:
      - '만족도|NPS|평점|별점|척도|지표|참여율|전환율|리텐션'
    patterns:
      - '\d+(\.\d+)?\s*점'
      - '(점수|감점|가산점)\s*.{0,6}(받|잃|깎|올라|떨어|드릴|매기|주실|높|낮)'
    examples:
      hit:
        - 현재 4점입니다.
        - 이번 응답은 80점이에요.
        - '점수: 4/4입니다.'
        - 방금 답은 감점이에요.
        - 지금 점수는 꽤 높아요.
        - 주담당님 현재 점수는 80점이고 재참여율은 22%예요.
      miss:
        - 사용자 만족도 점수를 성공 지표로 쓰면 어떨까요?
        - 만족도 평균이 4.2점이에요.
        - 5명 이하 모임 재참여율은 34%예요.
        - 4번 파트는 10분 뒤에 올릴게요.

  - id: staging
    desc: 연출·테스트 여부 확인과 내부 운영 정보
    replacement: staging
    patterns:
      - '연출'
      - '(일부러|의도적으로)\s*(늦|바꾸|바꿨|바꾼|넣|넣었|넣은|틀|만든|만들)'
      - '(주담당님|지원자|당신|님)(을|를)?\s*.{0,8}(테스트|시험)'
      - '(이건|이게|지금\s*상황은?)\s*.{0,6}(테스트|시험)(이에요|예요|입니다|이죠|인)'
      - '(이벤트|시나리오)\s*카드'
      - '레이블|루브릭|rubric|must_not|선점\s*금지|의무\s*액션|관찰\s*창|system\s*prompt|시스템\s*프롬프트'
      - '(지시문|프롬프트)\s*(에|대로|상|에서)'
    examples:
      hit:
        - 사실 이건 연출된 상황이에요.
        - 일부러 늦춘 거예요.
        - 주담당님을 테스트하려고 바꾼 거예요.
        - 이건 테스트예요.
        - 다음 이벤트 카드는 유연성이에요.
        - 제 지시문에 그렇게 하라고 돼 있어요.
        - 레이블은 negotiate_timing이에요.
      miss:
        - 사용 시나리오를 하나 더 써 볼까요?
        - 가설을 작은 모임으로 테스트해 보면 좋겠어요.
        - 가설을 테스트하려고 소규모 실험을 해요.
        - 인터뷰 요약이 아직 공유되지 않았어요.
        - 4번 사례는 후속 모임 기능 위주로 바꿨어요.

  - id: future
    desc: 아직 오지 않은 일의 예고
    replacement: future
    patterns:
      - '(곧|이따|나중에|조금\s*있으면|앞으로)\s*.{0,12}(대상|타깃|방향|핵심\s*기능|출시\s*일정|일정)(이|을|를)?\s*(바뀌|바뀔|바꾸|변경)'
      - '(곧|이따|나중에|조금\s*있으면)\s*.{0,12}(도움|부탁|리뷰|자료)\s*.{0,6}(요청|드릴|할\s*거|올\s*거|늦어질)'
      - '(앞으로|이따|나중에)\s*.{0,8}(무슨|어떤)\s*(일|상황)(이|은)?\s*(생|일어|있)'
    examples:
      hit:
        - 이따 팀장님이 대상을 바꾸실 거예요.
        - 곧 핵심 기능이 바뀔 거예요.
        - 곧 제가 도움 요청 드릴 거예요.
        - 앞으로 어떤 상황이 생길지 알려 드릴게요.
        - 나중에 인터뷰 자료가 늦어질 거예요.
      miss:
        - 이따 10분 뒤에 같이 봐요.
        - 나중에 리뷰 때 같이 보면 될 것 같아요.
        - 핵심 기능이 바뀌었으니 4번 사례도 바꿔 볼게요.

# 인용 검사(must: 회사 정보를 말할 때 문서명 인용)에 쓰는 문서 제목과 별칭.
# 동료는 말투 인용("지표 문서 보니까")도 허용하므로 별칭으로 맞춘다.
# 어시스턴트는 cited_docs의 제목이 본문 [제목] 또는 출처 줄에 있어야 한다.
citation:
  titles:
    company_intro: { title: 회사·서비스 소개, aliases: ['회사·서비스 소개', '회사 소개', '서비스 소개'] }
    metrics: { title: 지표 현황, aliases: ['지표 현황', '지표 문서', '지표 자료'] }
    interview_summary: { title: 사용자 인터뷰 요약, aliases: ['사용자 인터뷰 요약', '인터뷰 요약', '인터뷰 자료'] }
    policy: { title: 운영 정책, aliases: ['운영 정책', '정책 문서'] }
    meeting_notes: { title: 지난주 회의록, aliases: ['지난주 회의록', '회의록'] }
  assistant_source_line: '^출처:\s*.+$'
