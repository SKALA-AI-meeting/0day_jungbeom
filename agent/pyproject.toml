[project]
name = "dayzero-agent"
version = "0.1.0"
description = "Day Zero FastAPI agent server (LangGraph + Harness) and MCP servers (business, rag, detector)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "aio-pika>=9.4",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "fastmcp>=2.10",
  "google-genai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
